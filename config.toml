baseURL = "https://blog.pipetail.io/"
title = "pipetail Blog"
copyright = "© 2026 pipetail"
locale = "en"
theme = "pipetail"

[taxonomies]
tag = "tags"
author = "authors"

[params]
  description = "By Engineers. For Engineers."

  [params.social]
    email = "contact@pipetail.io"
    github = "https://github.com/pipetail"

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = true
    style = "github-dark"
  [markup.goldmark.renderer]
    unsafe = true

[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
  page = ["HTML", "markdown"]
